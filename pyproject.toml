[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxa-earth-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server and Skill wrapper for JAXA Earth Python API (jaxa.earth.je)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["jaxa", "earth-observation", "satellite", "mcp", "model-context-protocol", "skill", "gis", "stac"]
authors = [
    { name = "JAXA Earth MCP Community" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "jaxa-earth>=0.1.6",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "twine",
]

[project.scripts]
jaxa-earth-mcp = "jaxa_earth_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/kannkyo/jaxa-earth-mcp"
Documentation = "https://data.earth.jaxa.jp/api/python/v0.1.6/docs.md"
Repository = "https://github.com/kannkyo/jaxa-earth-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxa_earth_mcp"]
